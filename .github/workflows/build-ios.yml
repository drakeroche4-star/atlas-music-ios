name: Build ATLAS Music IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ATLASMusic/**"
      - "project.yml"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project ATLASMusic.xcodeproj \
            -scheme ATLASMusic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "Could not find the built .app bundle."
            exit 1
          fi

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/

          /usr/bin/zip -qry ATLASMusic-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATLASMusic-unsigned-ipa
          path: ATLASMusic-unsigned.ipa
          if-no-files-found: error
