name: ATLASMusic

options:
  bundleIdPrefix: com.drakeroche
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  ATLASMusic:
    type: application
    platform: iOS
    sources:
      - path: ATLASMusic
        excludes:
          - Info.plist
    resources:
      - path: ATLASMusic/Assets.xcassets

    info:
      path: ATLASMusic/Info.plist

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drakeroche.atlasmusic
        PRODUCT_NAME: ATLASMusic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic

schemes:
  ATLASMusic:
    build:
      targets:
        ATLASMusic: all
    run:
      config: Debug
    archive:
      config: Release
